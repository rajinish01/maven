name: Lint and Security Checks (UI)

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint (lint + security)
        run: npx eslint . --ext .ts,.tsx
